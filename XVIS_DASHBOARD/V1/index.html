<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NETRA 5-Sensor Acoustic Plot</title>
<style>
body {
  font-family: sans-serif;
  margin: 24px;
  background: #ffffff;
  color: #000000;
}
canvas {
  border: 1px solid #000000;
  display: block;
}
.label {
  margin-top: 10px;
  font-size: 13px;
  font-family: monospace;
}
</style>
</head>
<body>

<h3>NETRA 5-Sensor Perimeter Mapping</h3>
<canvas id="c" width="600" height="500"></canvas>
<div class="label" id="val">Waiting for 5-sensor stream...</div>

<script>
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const elVal = document.getElementById("val");

const cx = cv.width / 2;
const cy = cv.height / 2;
const scale = 3.2;

let dists = [60, 60, 60, 60, 60];
let curServo = 180;

const angles = [180, 0, 115, 65, 270];
const names = ["L-Shldr", "R-Shldr", "Chest-L", "Chest-R", "Back"];

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = "#e8e8e8";
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);

  for (let r = 20; r <= 60; r += 20) {
    ctx.beginPath();
    ctx.arc(cx, cy, r * scale, 0, 2 * Math.PI);
    ctx.stroke();

    ctx.fillStyle = "#888";
    ctx.font = "10px sans-serif";
    ctx.fillText(r + " cm", cx + r * scale + 4, cy - 4);
  }
  ctx.setLineDash([]);

  ctx.fillStyle = "#1f77b4";
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, 2 * Math.PI);
  ctx.fill();
  ctx.font = "11px sans-serif";
  ctx.fillText("Origin", cx - 15, cy + 18);

  for (let i = 0; i < 5; i++) {
    const d = Math.min(60, dists[i]);
    const rad = (angles[i] * Math.PI) / 180;
    const px = cx + d * scale * Math.cos(rad);
    const py = cy - d * scale * Math.sin(rad);

    ctx.strokeStyle = "#cccccc";
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(px, py);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = d <= 15 ? "#d62728" : "#2ca02c";
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, 2 * Math.PI);
    ctx.fill();

    ctx.fillStyle = "#222222";
    ctx.font = "11px monospace";
    ctx.fillText(names[i] + ": " + d.toFixed(1) + "cm", px + 8, py + 4);
  }

  requestAnimationFrame(draw);
}
draw();

const ev = new EventSource("/s");
ev.onmessage = (e) => {
  const data = JSON.parse(e.data);
  if (Array.isArray(data[0])) {
    dists = data[0];
    curServo = data[1];
  } else {
    dists[0] = data[0];
    curServo = data[1];
  }

  elVal.innerText =
    "S1:" + dists[0].toFixed(1) + "cm | " +
    "S2:" + dists[1].toFixed(1) + "cm | " +
    "S3:" + dists[2].toFixed(1) + "cm | " +
    "S4:" + dists[3].toFixed(1) + "cm | " +
    "S5:" + dists[4].toFixed(1) + "cm | " +
    "Servo: " + curServo + " deg";
};
</script>
</body>
</html>
